<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - رياحين الجنة</title>
</head>

<body dir="rtl">

    <center>

        <div style="width:95%; max-width:1000px;">

            <nav style="font-size:clamp(14px, 2.5vw, 20px); line-height:2.5;">

                <a href="index.html">تسجيل الدخول</a> |
                <a href="home.html">الرئيسية</a> |
                <a href="sahabyat.html">الصحابيات</a> |
                <a href="askus.html">اتصل بنا</a>

            </nav>

            <hr>

            <h1 style="font-size:clamp(26px, 5vw, 40px);">
                تواصل معنا
            </h1>

            <p style="font-size:clamp(18px, 3vw, 24px); line-height:1.8;">
                لو عندك سؤال أو اقتراح، أرسليه لينا.
            </p>

            <br>

            <form>

                <p style="font-size:clamp(18px, 2.5vw, 22px);">
                    اسمك:
                    <br><br>
                    <input type="text"
                           name="name"
                           placeholder="أدخلي اسمك"
                           required
                           style="width:90%; max-width:450px; height:45px; font-size:18px; box-sizing:border-box;">
                </p>

                <p style="font-size:clamp(18px, 2.5vw, 22px);">
                    بريدك الإلكتروني:
                    <br><br>
                    <input type="email"
                           name="email"
                           placeholder="أدخلي بريدك الإلكتروني"
                           required
                           style="width:90%; max-width:450px; height:45px; font-size:18px; box-sizing:border-box;">
                </p>

                <p style="font-size:clamp(18px, 2.5vw, 22px);">
                    رسالتك:
                    <br><br>
                    <textarea name="message"
                              rows="6"
                              placeholder="اكتبي رسالتك هنا"
                              required
                              style="width:90%; max-width:450px; font-size:18px; box-sizing:border-box; resize:vertical;"></textarea>
                </p>

                <p>
                    <button type="submit"
                            style="width:90%; max-width:450px; min-height:50px; font-size:20px;">
                        إرسال الرسالة
                    </button>
                </p>

            </form>

            <hr>

            <h2 style="font-size:clamp(22px, 4vw, 30px);">
                معلومات التواصل
            </h2>

            <p style="font-size:clamp(16px, 2.5vw, 20px);">
                البريد الإلكتروني:
                <br>
                rayahin@example.com
            </p>

            <p style="font-size:clamp(16px, 2.5vw, 20px);">
                رقم الهاتف:
                <br>
                0123456789
            </p>

            <br>

            <hr>

            <footer style="font-size:clamp(14px, 2vw, 18px); line-height:1.8;">
                <p>رياحين الجنة - موقع يهتم بسيرة الصحابيات رضي الله عنهن</p>
                <p>جميع الحقوق محفوظة &copy; 2026</p>
            </footer>

        </div>

    </center>

</body>
</html>
