<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
</head>

<body dir="rtl">

    <h1>
        <font size="6">تسجيل الدخول</font>
    </h1>

    <form action="home.html" method="get">

        <p>
            <font size="5">
                الاسم:
            </font>
            <br>
            <input type="text"
                   name="username"
                   placeholder="أدخل الاسم"
                   required
                   style="width: 90%; height: 45px; font-size: 20px;">
        </p>

        <p>
            <font size="5">
                كلمة المرور:
            </font>
            <br>
            <input type="password"
                   name="password"
                   placeholder="أدخل كلمة المرور"
                   required
                   minlength="4"
                   style="width: 90%; height: 45px; font-size: 20px;">
        </p>

        <p>
            <button type="submit"
                    style="width: 90%; height: 50px; font-size: 22px;">
                دخول
            </button>
        </p>

    </form>

</body>
</html>
